# hoisted, NOT the default symlink farm: pnpm's links carry MSYS paths on
# Windows and next build copies that shape into .next/standalone, which then
# dies on the box with 'Cannot find module next'. tar -h does not save you.
nodeLinker: hoisted

minimumReleaseAgeExclude:
  - '@next/env@16.3.2'
  - '@next/swc-darwin-arm64@16.3.2'
  - '@next/swc-darwin-x64@16.3.2'
  - '@next/swc-linux-arm64-gnu@16.3.2'
  - '@next/swc-linux-arm64-musl@16.3.2'
  - '@next/swc-linux-x64-gnu@16.3.2'
  - '@next/swc-linux-x64-musl@16.3.2'
  - '@next/swc-win32-arm64-msvc@16.3.2'
  - '@next/swc-win32-x64-msvc@16.3.2'
  - next@16.3.2
